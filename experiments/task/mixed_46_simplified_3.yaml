# Simplified Mixed Human-Robot Task Configuration (46D data, 44D human loss, 3 cameras)
# Supports hybrid data with both Robot (16D effective) and Human (46D data, 44D loss) episodes

_target_: simhum.task.BCTask
obs_dim: 46     # Unified state dimension (Human 46D, Robot 16D+30D padding)
ac_dim: 46      # Unified action dimension (Human 46D, Robot 16D+30D padding)  
n_cams: ${len:${task.train_buffer.cam_indexes}}

train_buffer:
  _target_: simhum.replay_buffer.RobobufReplayBuffer
  buffer_path: ${buffer_path}
  transform: ${transform:${train_transform}}
  n_test_trans: 500
  ac_chunk: ${ac_chunk}
  mode: train
  cam_indexes: [0,1,2]  # 3 cameras
  goal_indexes: []
  past_frames: ${add:${img_chunk},-1}
  ac_dim: ${task.ac_dim}

test_buffer:
  _target_: simhum.replay_buffer.RobobufReplayBuffer
  buffer_path: ${buffer_path}
  transform: ${transform:preproc}
  n_test_trans: 500
  ac_chunk: ${ac_chunk}
  mode: test
  cam_indexes: ${task.train_buffer.cam_indexes}
  goal_indexes: ${task.train_buffer.goal_indexes}
  past_frames: ${add:${img_chunk},-1}
  ac_dim: ${task.ac_dim}
