# Human Data Format Examples - Complete Configuration

data_sources:
  # Example: 44-dim format (pose: EEF + fingertips, no gripper)
  - type: "HumanCollect"
    path: "/path/to/datasets/human_data"
    tasks: 
    # - "put_object_cabinet_1130"
    # - "place_bread_basket_1126"
    # - "click_bell_1124"
    - "grab_roller_1125"
    # - "stack_bowls_two_1104"
    max_episodes_per_task: 500
    # instruction: "Pick up the bread on the table and place it into the basket."
    # instruction: "Click the center of the bell on the table." 
    # instruction: "Pick up one bowl and place it in the center of the table, then stack the other on top."
    
    # HumanCollect-specific options
    human_output_format: 44             # [left_eef(7) + right_eef(7) + fingertips(30)]
    

output:
  target_path: "/path/to/datasets/processed"
  dataset_name: "human_grab_roller_500"
  normalization: "max_min"

processing:
  show_progress: true
  verbose: true

# Format description:
# - 46-dim: [left_eef(7)  + fingertips(15) + left_gripper(1) + right_eef(7) + fingertips(15) + right_gripper(1)]
# - 44-dim: [left_eef(7)  + fingertips(15)  + right_eef(7) + fingertips(15)] - no gripper info
# - 16-dim: [left_eef(7) + left_gripper(1) + right_eef(7) + right_gripper(1)] - no fingertip info