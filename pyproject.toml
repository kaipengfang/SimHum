[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simhum"
version = "1.0.0"
description = "SimHum: Simulation-to-Human Transfer for Robot Learning"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Kaipeng Fang", email = "fangkaipeng@126.com"}
]
keywords = ["robotics", "robot learning", "imitation learning", "diffusion policy", "sim-to-real"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core ML frameworks
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0,<2.0.0",  # Pin to 1.x for compatibility
    
    # Diffusion models
    "diffusers>=0.21.0",
    
    # Vision models
    "timm>=0.9.0",
    "transformers>=4.30.0",
    
    # Data processing
    "h5py>=3.8.0",
    "opencv-python>=4.8.0",
    "scipy>=1.10.0",
    
    # Replay buffer
    "robobuf>=0.0.1",
    
    # Configuration
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    
    # Training utilities
    "accelerate>=0.20.0",
    "wandb>=0.15.0",
    "tqdm>=4.65.0",
    
    # Visualization
    "matplotlib>=3.7.0",
    
    # Web server (for evaluation)
    "flask>=3.0.0",
    "requests>=2.31.0",
    
    # Utilities
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
]

r3m = [
    "r3m>=0.1.0",  # Optional R3M visual encoder
]

all = [
    "simhum[dev,r3m]",
]

[project.urls]
Homepage = "https://github.com/kaipengfang/simhum"
Repository = "https://github.com/kaipengfang/simhum"
Documentation = "https://github.com/kaipengfang/simhum#readme"
"Bug Tracker" = "https://github.com/kaipengfang/simhum/issues"

[tool.setuptools]
packages = ["simhum", "simhum.models", "simhum.trainers"]

[tool.setuptools.package-data]
simhum = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
